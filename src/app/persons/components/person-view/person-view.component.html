<div class="person-view">
  @if (editing()) {
    <app-person-edit [person]="person()"
                     (cancelled)="onEditCancelled()"
                     (saved)="onEditSaved($event)"/>
  } @else {
    <div class="person-view-name">
      {{ person().name }}
    </div>
  }

  @if (showButtons()) {
    <div class="person-view-buttons">
      <button class="btn btn-outline-primary btn-sm"
              (click)="onEdit()">
        <i class="bi-pencil"></i>
        <span class="visually-hidden" i18n="@@p.edit">Edit</span>
      </button>
      <!-- DeleteButtonComponent renders the button's content itself. -->
      <!-- eslint-disable-next-line @angular-eslint/template/elements-content -->
      <button app-delete-button additionalClasses="btn-sm"
              [outline]="true"
              (deleteConfirmed)="onDeleteConfirmed()"></button>
    </div>
  }
</div>
